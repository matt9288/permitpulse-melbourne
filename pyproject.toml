[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "permitpulse-melbourne"
version = "0.1.0"
description = "Open-data building-permit intelligence prototype for Victoria"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Matt Liao" }]
dependencies = [
  "duckdb>=1.4,<2",
  "pandas>=2.2,<4",
  "plotly>=6,<7",
  "pyxlsb>=1.0.10,<2",
  "python-calamine>=0.3,<1",
  "streamlit>=1.50,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
permitpulse = "permitpulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
